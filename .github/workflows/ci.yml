name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button in the Actions tab (redeploys main)

# A newer commit on the same PR cancels the older check. Runs on main are queued instead,
# so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    # Throwaway database for migrations and integration tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noloroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/noloroute_test
      # No GOOGLE_PLACES_API_KEY: route planning uses its offline estimates in tests.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Check migrations can be rolled back
        run: alembic downgrade base && alembic upgrade head

      - name: Run tests
        run: pytest -v

      - name: Check the Docker image builds
        run: docker build --tag noloroute-api:ci .

  deploy:
    name: Deploy
    needs: [lint, frontend, test]
    # Only for main (pushes or the manual button), and only once the GCP repository variables are configured.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke-test.outputs.url }}
    permissions:
      contents: read
      id-token: write  # lets GitHub request a short-lived GCP token (Workload Identity Federation)

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: noloroute-api
      MIGRATE_JOB: noloroute-migrate
      INGEST_JOB: noloroute-ingest
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/noloroute/api:${{ github.sha }}
      SQL_INSTANCE: ${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:noloroute-db
      RUNTIME_SA: noloroute-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v5

      # No stored key: GitHub proves its identity to GCP and gets a token valid for this run only.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # Migrations run inside GCP as a Cloud Run job, so the database needs no public access.
      - name: Run database migrations
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=database-url:latest,GOOGLE_PLACES_API_KEY=maps-api-key:latest,JWT_SECRET_KEY=jwt-secret:latest" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --quiet

      # Kept on the current image but not run here: POI ingestion calls the paid Places API, so it
      # is started by hand when needed (gcloud run jobs execute noloroute-ingest).
      - name: Update the POI ingestion job
        run: |
          gcloud run jobs deploy "$INGEST_JOB" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=database-url:latest,GOOGLE_PLACES_API_KEY=maps-api-key:latest" \
            --command python \
            --args=-m,scripts.ingest_places \
            --max-retries 0 \
            --task-timeout 1200s \
            --memory 1Gi \
            --quiet

      - name: Smoke test
        id: smoke-test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/health"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${GITHUB_SHA::7}\` to $URL" >> "$GITHUB_STEP_SUMMARY"
