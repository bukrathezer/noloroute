[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]  # auto-generated migrations

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
