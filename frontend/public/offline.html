<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <title>NoloRoute</title>
    <!-- Shown by the service worker (sw.js) when a page is opened without a connection; it is
         kept in the browser's cache, so everything it needs is in this file. -->
    <style>
      :root {
        --brand: #2563eb;
        --on-brand: #ffffff;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --text: #1c1b19;
        --muted: #6b6a64;
        --border: #e3e2dc;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #2563eb;
          --on-brand: #ffffff;
          --bg: #05070d;
          --surface: #0b1122;
          --text: #e8edf7;
          --muted: #93a0bf;
          --border: #1c2744;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.45;
      }
      main {
        max-width: 360px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        height: 40px;
        padding: 0 20px;
        border: none;
        border-radius: 10px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0f766e" />
        <path d="M9 23c0-4 3-5 6-6s6-2 6-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 4.2" />
        <circle cx="9" cy="23" r="2.6" fill="#fff" />
        <path d="M21 5.5a4 4 0 0 0-4 4c0 3 4 6.5 4 6.5s4-3.5 4-6.5a4 4 0 0 0-4-4z" fill="#fbbf24" />
        <circle cx="21" cy="9.5" r="1.4" fill="#0f766e" />
      </svg>
      <h1 id="title">You're offline</h1>
      <p id="text">NoloRoute needs an internet connection to plan routes. Try again once you're connected.</p>
      <button type="button" id="retry" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // The language chosen in the app, else the browser's.
      let lang = navigator.language || "";
      try {
        lang = localStorage.getItem("lang") || lang;
      } catch {
        // Storage unavailable: the browser's language it is.
      }
      if (lang.toLowerCase().startsWith("tr")) {
        document.documentElement.lang = "tr";
        document.getElementById("title").textContent = "İnternet bağlantısı yok";
        document.getElementById("text").textContent =
          "NoloRoute rota planlamak için internete ihtiyaç duyar. Bağlantın gelince tekrar dene.";
        document.getElementById("retry").textContent = "Tekrar dene";
      }
    </script>
  </body>
</html>
